# Builds the tablet app whenever the app's code changes, and publishes
# it on the repository's Releases page so the tablet can download it.
name: Build tablet app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show the Android tools location
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" || true

      - name: Build the app
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "error:|ERROR|FAILURE|What went wrong|Could not|Exception|> " build.log | grep -v "^\s*at " | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build log::$msg"

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk DoorSign.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Door Sign app (build ${{ github.run_number }})
          body: Download DoorSign.apk below on the tablet and install it.
          files: DoorSign.apk
          make_latest: true
